# Minimale SearXNG-Konfiguration fuer aquaticy.
#
# Entscheidend ist der Eintrag `json` unter `search.formats` -- ohne den
# antwortet SearXNG nur mit HTML und aquaticy kann nichts damit anfangen.

use_default_settings: true

general:
  instance_name: "aquaticy"
  # Keine Nutzungsstatistik nach draussen.
  donation_url: false
  contact_url: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  # Nur ein Platzhalter: der echte Schluessel kommt aus SEARXNG_SECRET in der
  # .env (./aquaticy-box legt ihn zufaellig an; von Hand: `openssl rand -hex 32`).
  secret_key: "bitte-aendern-openssl-rand-hex-32"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true
